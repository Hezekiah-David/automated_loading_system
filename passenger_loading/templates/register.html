{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Register{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-oak text-white">
                <h4 class="mb-0"><i class="bi bi-person-plus"></i> Register</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <button type="submit" class="btn btn-oak w-100">Register</button>
                </form>
                <p class="mt-3 text-center">Already have an account? <a href="{% url 'passenger_loading:login' %}">Login</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
